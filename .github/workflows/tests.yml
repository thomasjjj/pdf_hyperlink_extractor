name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: uv.lock
      - run: python -m pip install uv==0.12.23
      - run: uv sync --locked --extra streamlit
      - run: uv run --locked --extra streamlit ruff check .
      - run: uv run --locked --extra streamlit ruff format --check .
      - run: uv run --locked --extra streamlit python -m pytest --cov --cov-report=term-missing

  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[streamlit]" --group dev uv==0.12.23
      - run: uv lock --check
      - run: uv build --out-dir dist/uv
      - run: python -m build --outdir dist/build
      - run: python -m twine check dist/uv/* dist/build/*
      - run: python -m scripts.verify_installation dist/uv
      - run: python -m scripts.verify_installation dist/build
      - run: python -m pip uninstall --yes streamlit
      - run: python -m pytest -m "not streamlit"
