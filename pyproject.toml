[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
filterwarnings = ["error"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.coverage.run]
branch = true
source = [
    "extractors", "docx_extractor", "pdf_extractor", "link_patterns",
    "extraction_utils", "extraction_errors", "streamlit_app",
]

[tool.coverage.report]
show_missing = true
fail_under = 90
